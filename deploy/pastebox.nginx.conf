# PasteBox vhost. Requires the host's maintained Cloudflare real-IP and
# $from_cloudflare_origin configuration. No query strings or credentials in logs.
log_format pastebox_access escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
limit_req_zone $binary_remote_addr zone=pastebox_requests:2m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pastebox_connections:1m;
server {
    listen 443 ssl;
    server_name pastebox.micutu.com;
    include /etc/nginx/snippets/block-dotfiles.conf;
    if ($from_cloudflare_origin = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/pastebox.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pastebox.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log /var/log/nginx/pastebox.access.log pastebox_access;
    error_log /var/log/nginx/pastebox.error.log warn;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /api/ {
        limit_req zone=pastebox_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn pastebox_connections 10;
        limit_conn_status 429;
        error_page 429 = @pastebox_limited;
        proxy_pass http://127.0.0.1:7777;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location @pastebox_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        return 429 '{"error":"Too many requests. Please retry shortly."}';
    }
    location ^~ /embed/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        # An explicit add_header set prevents inherited X-Frame-Options here.
        # The backend's public-only document sets frame-ancestors *.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:7777;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location / {
        proxy_pass http://127.0.0.1:7777;
    }
}
server {
    listen 80;
    server_name pastebox.micutu.com;
    include /etc/nginx/snippets/block-dotfiles.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://pastebox.micutu.com$request_uri; }
}
